<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | CODM Style Website</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="main-header">
    <div class="logo">ASH</div>
    <nav class="nav-menu">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="hero hero-contact">
    <div class="hero-content">
      <h1>Contact</h1>
      <p>Send a message — keep it short and clear.</p>
    </div>
  </section>


  <section class="features-section">
    <h2>Message Form</h2>

    <div class="card" style="max-width: 720px; margin: 0 auto; text-align:left;">
      <form id="contactForm">
        <label style="display:block; margin-bottom:8px; font-weight:600;">Name</label>
        <input type="text" id="name" required
               style="width:94.5%; padding:12px; border-radius:6px; border:1px solid #333; background:#0f0f0f; color:#EFEFEF; margin-bottom:16px;">

        <label style="display:block; margin-bottom:8px; font-weight:600;">Email</label>
        <input type="email" id="email" required
               style="width:94.5%; padding:12px; border-radius:6px; border:1px solid #333; background:#0f0f0f; color:#EFEFEF; margin-bottom:16px;">

        <label style="display:block; margin-bottom:8px; font-weight:600;">Message</label>
        <textarea id="message" rows="5" required
                  style="width:94.5%; padding:12px; border-radius:6px; border:1px solid #333; background:#0f0f0f; color:#EFEFEF; margin-bottom:16px;"></textarea>

        <button type="submit" class="btn-primary" style="border:none; cursor:pointer;">Send</button>
        <p id="status" style="margin-top:14px; opacity:0.9;"></p>
      </form>
    </div>
  </section>

  <footer class="footer">
    <p>CODM-style inspiration — custom build by Ca3kie.</p>
  </footer>

  <script src="script.js"></script>
  <script>
    document.getElementById("contactForm").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("status").textContent = "Message prepared. (No backend connected yet.)";
    });
  </script>
</body>
</html>
